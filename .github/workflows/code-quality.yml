name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.2.0
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: Check with Biome
        run: pnpm run check

      - name: Check types
        run: pnpm run type-check
